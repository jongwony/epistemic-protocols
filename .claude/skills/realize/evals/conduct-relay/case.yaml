schema_version: "1.1"
name: conduct-relay

context:
  # Same substrate as the map-gate and taking cases, deliberately: the material still offers every
  # fork of method those cases leave open. Here the prompt settles each of them in the person's
  # words, so the map is relayed and the work starts in the same turn; a gate opened on any of
  # them is the failure under observation.
  # The environment, for every arm and every turn, first and resumed: delegation to another agent
  # or session is unavailable (`delegation: false` of the `conduct` target in harness.config.json),
  # so the method runs in this session, and the work starts with a write to one of that target's
  # `workTargets`.
  scaffold_script: ../conduct-scaffold.sh
