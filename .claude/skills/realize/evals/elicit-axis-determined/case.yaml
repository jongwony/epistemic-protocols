schema_version: "1.1"
name: elicit-axis-determined

context:
  # Same substrate as the trigger-positive case, deliberately: NOTES.md, CONVENTIONS.md and the
  # ADRs still carry every latent dissatisfaction the positive case reverse-traces. Here the
  # request fixes its own axes and values, so turning any of that into an open dimension of this
  # request is the failure under observation.
  scaffold_script: ../elicit-scaffold.sh

multi_turn:
  # Graded on turn 1 only. The oracle reply exists so a runner that always continues has a fixed
  # line to send; nothing after turn 1 enters a grader.
  oracle: oracle.md
  max_user_replies: 1
  snapshot_tree_per_turn: true
