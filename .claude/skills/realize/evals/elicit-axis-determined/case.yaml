schema_version: "1.1"
name: elicit-axis-determined

context:
  # Same substrate as the open-intent case, deliberately: NOTES.md, CONVENTIONS.md and the ADRs
  # still carry every latent dissatisfaction that case surfaces. Here the request settles its own
  # coordinates, so the invoked run opens on a first surface showing the intent as understood,
  # and the user resolves at once; turning any of that dissatisfaction into an open coordinate of
  # this request is the failure under observation.
  scaffold_script: ../elicit-scaffold.sh

multi_turn:
  # Graded on turn 1 (the first surface) and turn 2 (the closure the oracle's one reply gives, and
  # what proceeds from it).
  oracle: oracle.md
  max_user_replies: 1
  snapshot_tree_per_turn: true
