name: Lean

# Elaborates every Lean Definition block and the proof file that proves its stated
# theorems. The verifier already does this when a toolchain is reachable and warns
# when none is; this job makes one reachable, so the verdict here is never the warn.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lean-definition:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install the pinned Lean toolchain
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Static checks
        run: |
          set +e
          node .claude/skills/verify/scripts/static-checks.js . > static-checks.json
          set -e
          node -e '
            const r = require("./static-checks.json");
            const lean = [...r.fail, ...r.warn].filter(x => x.check === "lean-definition");
            for (const x of r.fail) console.log(`::error file=${x.file}::${x.check}: ${x.message}`);
            for (const x of lean) if (r.warn.includes(x)) console.log(`::error file=${x.file}::${x.check}: ${x.message}`);
            process.exit(r.fail.length > 0 || lean.length > 0 ? 1 : 0);
          '
