name: Lean

# Installs the pinned toolchain and runs the Lean audit's fixtures (`lake test`),
# then the static checks, where every `fail` blocks. lean-definition runs the one
# driver in lean-contract.js — generate the contract modules from each SKILL.md
# Lean block, `lake build --wfail`, then the checked-in audit as `lake lint` —
# with a toolchain reachable, so its verdict here is never the warn. The node
# test suites run after them, one invocation at a time.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lean-definition:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # Full history: version-staleness measures a pull request's plugin changes
      # from its merge-base with the base branch, which a shallow clone lacks.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Installs the toolchain lean-toolchain pins and runs `lake test`. The build
      # and the audit need the generated contracts, so the static checks run them.
      - uses: leanprover/lean-action@v1
        with:
          build: 'false'
          test: 'true'
          lint: 'false'

      - name: Static checks
        run: |
          set +e
          node .claude/skills/verify/scripts/static-checks.js . > static-checks.json
          set -e
          node -e '
            const r = require("./static-checks.json");
            const lean = [...r.fail, ...r.warn].filter(x => x.check === "lean-definition");
            for (const x of r.fail) console.log(`::error file=${x.file}::${x.check}: ${x.message}`);
            for (const x of lean) if (r.warn.includes(x)) console.log(`::error file=${x.file}::${x.check}: ${x.message}`);
            process.exit(r.fail.length > 0 || lean.length > 0 ? 1 : 0);
          '

      # Sequential after the static checks, never beside them: liveness tests
      # mutate SKILL.md files the verifier reads. static-checks.test.mjs runs the
      # verifier over the tree itself, so it takes its own invocation.
      - name: Tests
        if: ${{ !cancelled() }}
        run: node --test $(git ls-files '*.test.js' '*.test.mjs' | grep -v '^.claude/skills/verify/scripts/static-checks.test.mjs$')

      - name: Static check tests
        if: ${{ !cancelled() }}
        run: node --test .claude/skills/verify/scripts/static-checks.test.mjs
