name: Type Realization

# Manual dispatch only, deliberately. This workflow spends real model budget on every
# run, so binding it to `pull_request` would charge for pushes nobody asked to
# measure. The repository has stood here before: the style-audit workflow reduced to
# `workflow_dispatch` for the same reason before it was parked.
#
# Dispatch it from the Actions tab against a PR's branch after the PR is open. With no
# `pr` input it resolves the PR for the dispatched ref and comments there.

on:
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number to comment on (blank = resolve from the dispatched branch)'
        required: false
        type: string
      runner:
        description: 'Agent runner'
        required: true
        default: claude
        type: choice
        options:
          - claude
          - codex
      models:
        description: 'Comma-separated model ids (blank = harness.config.json)'
        required: false
        type: string
      arms:
        description: 'Comma-separated arms (Codex: bare,protocol; Claude also supports style arms)'
        required: false
        type: string
      cases:
        description: 'Comma-separated case names (blank = all)'
        required: false
        type: string
      runs:
        description: 'Repetitions per cell (blank = harness.config.json)'
        required: false
        type: string
      max_budget_usd:
        description: 'Claude per-run ceiling (blank = harness.config.json)'
        required: false
        type: string
      reasoning_effort:
        description: 'Codex reasoning effort (blank = harness.config.json)'
        required: false
        type: string
      timeout_seconds:
        description: 'Codex per-run timeout (blank = harness.config.json)'
        required: false
        type: string
      post_comment:
        description: 'Post the report as a PR comment'
        required: false
        default: true
        type: boolean

jobs:
  realize:
    runs-on: ubuntu-latest
    # A dispatched matrix can be widened without touching this file, so the ceiling is
    # generous. The selected runner's per-run budget or timeout is the operative bound.
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # An absent secret would otherwise surface as an authentication failure on the first
      # run, which reads like a broken runner rather than a missing credential.
      - name: Require the evaluation token
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REALIZE_RUNNER: ${{ inputs.runner }}
        run: |
          case "$REALIZE_RUNNER" in
            claude)
              if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
                echo "::error::Secret CLAUDE_CODE_OAUTH_TOKEN is not set on this repository."
                exit 1
              fi
              ;;
            codex)
              if [ -z "$OPENAI_API_KEY" ]; then
                echo "::error::Secret OPENAI_API_KEY is not set on this repository."
                exit 1
              fi
              ;;
          esac

      - name: Install Claude Code
        if: inputs.runner == 'claude'
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Install Codex
        if: inputs.runner == 'codex'
        run: |
          npm install -g @openai/codex
          codex --version

      - name: Resolve PR context
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_INPUT: ${{ inputs.pr }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Dispatch inputs reach the shell through the environment above, never through an
          # expression substitution inside this script body: GitHub substitutes the raw
          # string before bash parses the line, so an interpolated input is executed rather
          # than read, and a multi-line one forges the step outputs a later `gh` call
          # consumes. The number is checked to be a number before it is written out.
          # (The substitution syntax is not written out here even as prose -- the expression
          # parser scans the whole block and tries to evaluate what it finds in a comment.)
          if [ -n "$PR_INPUT" ]; then
            case "$PR_INPUT" in
              ''|*[!0-9]*) echo "::error::pr input must be a number"; exit 1 ;;
            esac
            echo "number=$PR_INPUT" >> "$GITHUB_OUTPUT"
          elif PR_JSON=$(gh pr view "$REF_NAME" --json number 2>/dev/null); then
            echo "number=$(echo "$PR_JSON" | jq -r '.number')" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No open PR for $REF_NAME; the report will be in the job summary only."
            echo "number=" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up the isolated evaluation environment
        env:
          REALIZE_RUNNER: ${{ inputs.runner }}
          REALIZE_MODELS: ${{ inputs.models }}
          REALIZE_REASONING_EFFORT: ${{ inputs.reasoning_effort }}
          REALIZE_TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: .claude/skills/realize/scripts/setup.sh

      # A fresh runner has no marketplace plugins, so the baseline arm is empty here by
      # construction rather than by arrangement. The isolated config directory is kept
      # anyway: the same code path then runs locally and in CI, and `treatment_integrity`
      # still reports what actually loaded rather than what was assumed to.
      - name: Run
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REALIZE_RUNNER: ${{ inputs.runner }}
          REALIZE_MODELS: ${{ inputs.models }}
          REALIZE_ARMS: ${{ inputs.arms }}
          REALIZE_CASES: ${{ inputs.cases }}
          REALIZE_RUNS: ${{ inputs.runs }}
          REALIZE_MAX_BUDGET_USD: ${{ inputs.max_budget_usd }}
          REALIZE_REASONING_EFFORT: ${{ inputs.reasoning_effort }}
          REALIZE_TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
        run: node .claude/skills/realize/scripts/harness.mjs run

      - name: Report
        id: report
        env:
          REALIZE_RUNNER: ${{ inputs.runner }}
          REALIZE_MODELS: ${{ inputs.models }}
          REALIZE_ARMS: ${{ inputs.arms }}
          REALIZE_CASES: ${{ inputs.cases }}
          REALIZE_RUNS: ${{ inputs.runs }}
          REALIZE_REASONING_EFFORT: ${{ inputs.reasoning_effort }}
          REALIZE_TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          {
            echo "## Type realization — \`${REF_NAME}\` @ \`${GITHUB_SHA:0:8}\`"
            echo
            node .claude/skills/realize/scripts/harness.mjs report --markdown
            echo
            echo "[run log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      # Transcripts are observations: re-running produces different ones, so a failed
      # read of the table cannot be recovered by dispatching again.
      - name: Upload transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realize-results-${{ github.run_id }}
          path: .claude/skills/realize/results/
          if-no-files-found: warn
          retention-days: 30

      - name: Comment on the PR
        if: inputs.post_comment && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "${{ steps.pr.outputs.number }}" --body-file report.md

      - name: Tear down
        if: always()
        env:
          REALIZE_RUNNER: ${{ inputs.runner }}
        run: .claude/skills/realize/scripts/teardown.sh
